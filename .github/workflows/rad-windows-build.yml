name: RAD EDOPro v0.6 replay timeline Windows build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rad-windows-build.yml'
      - 'payload_v052/v052_ready.marker'
      - 'payload_v052/v052_build_hotfix.patch'
      - 'payload_v052/v060_timeline.patch'
      - 'payload_v052/v060_build_fix.patch'
      - 'tools/rad_replay_timeline.py'
      - 'REPLAY_TIMELINE_README_JA.txt'
  workflow_dispatch:

env:
  EDOPRO_COMMIT: 589ad27d2cc69efc4bf51d7e61c426ae4b1ae3f5
  CORE_COMMIT: 122e0d091a0f399221a4510cc98a406ae485905f
  LUA_COMMIT: 6e22fedb74cf0c9b6656e9fce8b7331db847c605
  OVERLAY_SHA256: beb6687bc1b1aa199d28e8d1f5c4e092ab6344b59562f5e496f965440c7ee1ed
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
  TRAVIS_OS_NAME: linux
  TARGET_OS: windows
  DXSDK_DIR: /tmp/d3d9sdk/
  VCPKG_ROOT: /tmp/vcpkg2
  BUILD_CONFIG: release
  ARCH: win32
  MINGW_LITE_VARIANT: -msvcrt
  VCPKG_TRIPLET: -mingw-static
  CC: /usr/local/bin/i686-w64-mingw32-gcc
  CXX: /usr/local/bin/i686-w64-mingw32-g++
  AR: /usr/local/bin/i686-w64-mingw32-gcc-ar

concurrency:
  group: rad-edopro-v060-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout RAD build repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify RAD v0.5.2 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat payload_v052/overlay.xz.b64.part* | tr -d '\n\r' | base64 --decode > /tmp/rad_overlay.tar.xz
          echo "$OVERLAY_SHA256  /tmp/rad_overlay.tar.xz" | sha256sum -c -
          xz -t /tmp/rad_overlay.tar.xz
          mkdir -p /tmp/rad_overlay
          tar -xJf /tmp/rad_overlay.tar.xz -C /tmp/rad_overlay
          test -f /tmp/rad_overlay/gframe/rad_client.cpp
          test -f /tmp/rad_overlay/gframe/replay_pace.h
          test -f /tmp/rad_overlay/ocgcore/ocgapi.cpp

      - name: Checkout pinned upstream EDOPro and core
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/edo9300/edopro.git edopro
          git -C edopro checkout "$EDOPRO_COMMIT"
          git -C edopro submodule update --init --recursive
          git -C edopro/ocgcore fetch origin "$CORE_COMMIT"
          git -C edopro/ocgcore checkout "$CORE_COMMIT"
          git -C edopro/ocgcore submodule update --init --recursive
          if [ -d edopro/ocgcore/lua/src/.git ] || git -C edopro/ocgcore/lua/src rev-parse --git-dir >/dev/null 2>&1; then
            git -C edopro/ocgcore/lua/src fetch origin "$LUA_COMMIT"
            git -C edopro/ocgcore/lua/src checkout "$LUA_COMMIT"
          fi

      - name: Apply RAD v0.6 source patches
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/rad_overlay/. edopro/
          git -C edopro apply "$GITHUB_WORKSPACE/payload_v052/v052_build_hotfix.patch"
          git -C edopro apply "$GITHUB_WORKSPACE/payload_v052/v060_timeline.patch"
          git -C edopro apply "$GITHUB_WORKSPACE/payload_v052/v060_build_fix.patch"
          test -f edopro/gframe/rad_client.cpp
          test -f edopro/gframe/replay_pace.h
          test -f edopro/gframe/replay_timeline.h
          grep -q 'replay_pace_percent' edopro/gframe/game_config.inl
          grep -q 'OCG_DuelSetActionCard' edopro/ocgcore/ocgapi.h
          grep -q 'GetPos(DuelPlayer\* dp) const' edopro/gframe/generic_duel.h
          grep -q 'ReplayTimeline::MESSAGE_ID' edopro/gframe/replay_mode.cpp
          grep -q 'IGUIButton.h' edopro/gframe/replay_mode.cpp

      - name: Validate timeline editor syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/rad_replay_timeline.py
          python3 tools/rad_replay_timeline.py --help >/dev/null

      - name: Configure dependency cache
        shell: bash
        run: echo "VCPKG_CACHE_ZIP_URL=$DEPENDENCIES_BASE_URL/installed_x86-windows-mingw-static.zip" >> "$GITHUB_ENV"

      - name: Install runner prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip xz-utils zstd patch

      - name: Install MinGW-lite toolchain
        working-directory: edopro
        shell: bash
        run: ./travis/install_mingw_lite.sh

      - name: Install premake
        working-directory: edopro
        shell: bash
        run: ./travis/install-premake5.sh

      - name: Install EDOPro dependencies
        working-directory: edopro
        shell: bash
        run: ./travis/dependencies.sh

      - name: Do not bundle font files
        working-directory: edopro
        shell: bash
        run: rm -f NotoSansJP-Regular.otf

      - name: Build matching RAD client and core
        working-directory: edopro
        shell: bash
        run: |
          chmod +x ./travis/build.sh
          set +e
          ./travis/build.sh > "$GITHUB_WORKSPACE/rad-build.log" 2>&1
          status=$?
          echo '===== RAD BUILD LOG TAIL ====='
          tail -n 180 "$GITHUB_WORKSPACE/rad-build.log"
          if [ "$status" -ne 0 ]; then
            echo '===== RAD BUILD ERROR LINES ====='
            grep -nEi 'error:|fatal error|undefined reference|cannot find|no such file|no rule to make|recipe for target|collect2:' "$GITHUB_WORKSPACE/rad-build.log" | tail -n 120 || true
          fi
          exit "$status"

      - name: Upload RAD build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rad-build-log
          path: rad-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Assemble Windows binary package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifact/RAD_EDOPro_v0.6_replay_timeline_Windows"
          mkdir -p "$OUT"
          EXE="$(find edopro/bin -type f -name 'ygoprodll.exe' -print -quit)"
          CORE="$(find edopro/bin -type f -name 'ocgcore.dll' -print -quit)"
          test -n "$EXE" && test -f "$EXE"
          test -n "$CORE" && test -f "$CORE"
          cp "$EXE" "$OUT/EDOPro.exe"
          cp "$CORE" "$OUT/ocgcore.dll"
          cp tools/rad_replay_timeline.py "$OUT/rad_replay_timeline.py"
          cp REPLAY_TIMELINE_README_JA.txt "$OUT/REPLAY_TIMELINE_README_JA.txt"
          cat > "$OUT/timeline_example.txt" <<'EOF'
          # packet indexes are 0-based; use inspect first
          before 120 pace 65
          before 120 wait 1200
          after 145 reset
          before 200 pause
          EOF
          printf '%s\n' \
            'RAD EDOPro v0.6 replay timeline Windows binaries' \
            "EDOPro upstream: $EDOPRO_COMMIT" \
            "ygopro-core upstream: $CORE_COMMIT" \
            'Manual Replay Pace: 50%-150%, default 85%.' \
            'Embedded replay timeline: PACE / WAIT / RESET / PAUSE.' \
            > "$OUT/WINDOWS_BINARY_STATUS.txt"
          find "$OUT" -type f \( -iname '*.otf' -o -iname '*.ttf' \) -delete
          (cd "$OUT" && sha256sum EDOPro.exe ocgcore.dll rad_replay_timeline.py > WINDOWS_SHA256.txt)

      - name: Upload RAD Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: RAD_EDOPro_v0.6_replay_timeline_Windows
          path: artifact/RAD_EDOPro_v0.6_replay_timeline_Windows
          if-no-files-found: error
          retention-days: 30
