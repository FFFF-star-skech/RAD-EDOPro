name: RAD EDOPro v0.5.2 replay pace Windows build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rad-windows-build.yml'
      - 'build_payload/**'
  workflow_dispatch:

env:
  EDOPRO_COMMIT: 589ad27d2cc69efc4bf51d7e61c426ae4b1ae3f5
  CORE_COMMIT: 122e0d091a0f399221a4510cc98a406ae485905f
  LUA_COMMIT: 6e22fedb74cf0c9b6656e9fce8b7331db847c605
  DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
  TRAVIS_OS_NAME: linux
  TARGET_OS: windows
  DXSDK_DIR: /tmp/d3d9sdk/
  VCPKG_ROOT: /tmp/vcpkg2
  BUILD_CONFIG: release
  ARCH: win32
  MINGW_LITE_VARIANT: -msvcrt
  VCPKG_TRIPLET: -mingw-static
  CC: /usr/local/bin/i686-w64-mingw32-gcc
  CXX: /usr/local/bin/i686-w64-mingw32-g++
  AR: /usr/local/bin/i686-w64-mingw32-gcc-ar

concurrency:
  group: rad-edopro-v052-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout RAD build repository
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.5.1 RAD source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rad_src
          cat build_payload/src.b64.part* | tr -d '\n\r' | base64 --decode > /tmp/rad_source.tar.gz
          gzip -t /tmp/rad_source.tar.gz
          tar -xzf /tmp/rad_source.tar.gz -C /tmp/rad_src
          RAD_MARKER="$(find /tmp/rad_src -type f -path '*/gframe/rad_client.cpp' -print -quit)"
          test -n "$RAD_MARKER" && test -f "$RAD_MARKER"
          RAD_OVERLAY_ROOT="${RAD_MARKER%/gframe/rad_client.cpp}"
          echo "RAD_OVERLAY_ROOT=$RAD_OVERLAY_ROOT" >> "$GITHUB_ENV"
          echo "Using RAD overlay root: $RAD_OVERLAY_ROOT"

      - name: Checkout pinned upstream EDOPro and core
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/edo9300/edopro.git edopro
          git -C edopro checkout "$EDOPRO_COMMIT"
          git -C edopro submodule update --init --recursive
          git -C edopro/ocgcore fetch origin "$CORE_COMMIT"
          git -C edopro/ocgcore checkout "$CORE_COMMIT"
          git -C edopro/ocgcore submodule update --init --recursive
          if [ -d edopro/ocgcore/lua/src/.git ] || git -C edopro/ocgcore/lua/src rev-parse --git-dir >/dev/null 2>&1; then
            git -C edopro/ocgcore/lua/src fetch origin "$LUA_COMMIT"
            git -C edopro/ocgcore/lua/src checkout "$LUA_COMMIT"
          fi

      - name: Apply RAD v0.5.1 source overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RAD_OVERLAY_ROOT"/. edopro/
          test -f edopro/gframe/rad_client.cpp
          grep -q 'OCG_DuelSetActionCard' edopro/ocgcore/ocgapi.h

      - name: Apply v0.5.2 replay pace patch
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 < build_payload/v0.5.2-replay-pace-gframe.patch
          test -f edopro/gframe/replay_pace.h
          grep -q 'replay_pace_percent' edopro/gframe/game_config.inl
          grep -q 'BUTTON_REPLAY_PACE_DOWN' edopro/gframe/event_handler.cpp

      - name: Configure dependency cache
        shell: bash
        run: |
          echo "VCPKG_CACHE_ZIP_URL=$DEPENDENCIES_BASE_URL/installed_x86-windows-mingw-static.zip" >> "$GITHUB_ENV"

      - name: Install runner prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip xz-utils zstd patch

      - name: Install MinGW-lite toolchain
        working-directory: edopro
        shell: bash
        run: ./travis/install_mingw_lite.sh

      - name: Install premake
        working-directory: edopro
        shell: bash
        run: ./travis/install-premake5.sh

      - name: Install EDOPro dependencies
        working-directory: edopro
        shell: bash
        run: ./travis/dependencies.sh

      - name: Do not bundle font files
        working-directory: edopro
        shell: bash
        run: rm -f NotoSansJP-Regular.otf

      - name: Build matching RAD client and core
        working-directory: edopro
        shell: bash
        run: ./travis/build.sh

      - name: Assemble Windows binary package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifact/RAD_EDOPro_v0.5.2_replay_pace_Windows"
          mkdir -p "$OUT"
          EXE="$(find edopro/bin -type f -name 'ygoprodll.exe' -print -quit)"
          CORE="$(find edopro/bin -type f -name 'ocgcore.dll' -print -quit)"
          test -n "$EXE" && test -f "$EXE"
          test -n "$CORE" && test -f "$CORE"
          cp "$EXE" "$OUT/EDOPro.exe"
          cp "$CORE" "$OUT/ocgcore.dll"
          RUNTIME_DB="$(find /tmp/rad_src -type f -path '*/runtime_overlay/expansions/RAD-actions.cdb' -print -quit || true)"
          if [ -n "$RUNTIME_DB" ]; then
            RUNTIME_ROOT="${RUNTIME_DB%/expansions/RAD-actions.cdb}"
            cp -a "$RUNTIME_ROOT"/. "$OUT/"
          fi
          printf '%s\n' \
            'RAD EDOPro v0.5.2-replay-pace Windows binaries' \
            "EDOPro upstream: $EDOPRO_COMMIT" \
            "ygopro-core upstream: $CORE_COMMIT" \
            'Includes replay pace control: 50%-150%, default 85%.' \
            'Built by GitHub Actions from the RAD v0.5.1 source payload plus the v0.5.2 replay pace patch.' \
            > "$OUT/WINDOWS_BINARY_STATUS.txt"
          find "$OUT" -type f \( -iname '*.otf' -o -iname '*.ttf' \) -delete
          (cd "$OUT" && sha256sum EDOPro.exe ocgcore.dll > WINDOWS_SHA256.txt)

      - name: Upload RAD Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: RAD_EDOPro_v0.5.2_replay_pace_Windows
          path: artifact/RAD_EDOPro_v0.5.2_replay_pace_Windows
          if-no-files-found: error
          retention-days: 30
